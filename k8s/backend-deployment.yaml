apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocd-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocd-backend
  template:
    metadata:
      labels:
        app: ocd-backend
    spec:
      containers:
        - name: backend
          image: ocd-backend:latest # Substitua pela sua imagem buildada
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/dashboard_ocd"
            - name: REPORT_USER
              value: "SEU_USUARIO"
            - name: REPORT_PASS
              value: "SUA_SENHA"
            - name: ALLOWED_HANDLERS
              value: "LOGIN1,LOGIN2"
---
apiVersion: v1
kind: Service
metadata:
  name: ocd-app-service
spec:
  type: NodePort # Para você acessar do seu navegador via localhost
  selector:
    app: ocd-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500 # Acessível em http://localhost:30500